
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "poetry", "run", "alembic", "upgrade", "head" ]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://payment_user:payment_password@postgres:5432/payment_db

  rabbitmq:
    image: rabbitmq:4.3.5-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  publisher:
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "poetry", "run", "python", "-m", "src.publisher" ]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://payment_user:payment_password@postgres:5432/payment_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    stop_grace_period: 75s


  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "poetry", "run", "faststream", "run", "src.consumer:app" ]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://payment_user:payment_password@postgres:5432/payment_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    stop_grace_period: 75s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "poetry", "run", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000" ]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://payment_user:payment_password@postgres:5432/payment_db
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully


volumes:
  postgres_data:
  rabbitmq_data:
